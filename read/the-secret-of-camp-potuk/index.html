<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>The Secret of Camp Potuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f5f2ea; --paper: #fbf9f3; --fg: #24221d; --muted: #645d52; --rule: #d8d2c3;
  --accent: #5a4a2f; --accent-soft: #ece6d6; --mark: #f1e2ae;
  --display: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  --body: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #17150f; --paper: #1d1a14; --fg: #e7e0d2; --muted: #a39a89; --rule: #35302a; --accent: #c8b48e; --accent-soft: #2a251c; --mark: #4a3f1f; color-scheme: dark; } }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 1.125rem; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 5rem; margin: 0; }
.wrap { max-width: 36rem; margin: 0 auto; min-width: 0; }
[hidden] { display: none !important; }

/* lock screen */
.lock { min-height: 90vh; display: flex; flex-direction: column; justify-content: center; padding-block: 3rem; }
.lock form { margin-top: 2rem; display: grid; gap: .8rem; max-width: 22rem; }
.lock label, .field label { font-family: var(--display); font-size: .9rem; color: var(--muted); }
input[type=password], input[type=text], textarea { font: inherit; font-family: var(--display); font-size: 1.05rem; color: var(--fg); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: .6rem .75rem; width: 100%; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { font: inherit; font-family: var(--display); font-weight: 700; font-size: 1rem; background: var(--accent); color: var(--paper); border: 0; border-radius: 6px; padding: .6rem 1.1rem; cursor: pointer; }
.btn.quiet { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--rule); font-weight: 500; }
.btn:disabled { opacity: .6; cursor: default; }
.check { display: flex; gap: .5rem; align-items: center; font-family: var(--display); font-size: .9rem; color: var(--muted); }
.msg { font-family: var(--display); font-size: .95rem; color: var(--muted); min-height: 1.5em; margin: 0; }
.msg.err { color: #a23b2a; }

/* the book */
.titlepage { padding-block: 3rem 2rem; border-bottom: 1px solid var(--rule); margin-bottom: 2rem; }
.eyebrow { font-family: var(--display); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .5rem; font-weight: 500; }
h1 { font-family: var(--body); font-weight: 600; font-size: 2.2rem; line-height: 1.1; margin: 0 0 .75rem; text-wrap: balance; }
.byline { font-family: var(--display); color: var(--muted); margin: 0 0 1.25rem; }
.status { font-family: var(--display); font-size: .95rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: .9rem; margin: 0; }
.status b { color: var(--fg); font-weight: 600; }
nav.toc { font-family: var(--display); margin-bottom: 2.5rem; }
nav.toc summary { cursor: pointer; font-weight: 700; letter-spacing: .04em; color: var(--accent); padding: .5rem 0; }
nav.toc ol { list-style: none; padding: 0; margin: .5rem 0 0 1rem; display: grid; gap: .15rem; }
nav.toc a { color: var(--muted); text-decoration: none; }
nav.toc li.bm { margin-top: .6rem; } nav.toc li.bm a { color: var(--fg); font-weight: 700; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); text-decoration: underline; outline: none; }
.chapter { padding-block: 1.5rem 2rem; border-top: 1px solid var(--rule); }
.chapter h3 { font-family: var(--body); font-weight: 600; font-size: 1.35rem; margin: 0 0 1.25rem; text-wrap: balance; }
.chno { display: block; font-family: var(--display); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: .3rem; }
.chapter p { margin: 0 0 1em; text-indent: 1.4em; }
.chapter h3 + p, .chapter hr + p, .chapter blockquote + p, .chapter p.display + p { text-indent: 0; }
.chapter p.display { text-indent: 0; text-align: center; font-variant: small-caps; letter-spacing: .08em; }
.chapter.matter p { text-indent: 0; }
.sc { font-variant: small-caps; letter-spacing: .04em; }
blockquote.letter { margin: 0 0 1em 1.4em; padding-left: .9rem; border-left: 2px solid var(--rule); font-size: .97em; }
blockquote.letter p { text-indent: 0; margin-bottom: .6em; }
hr.scene { border: 0; text-align: center; margin: 1.5em 0; }
hr.scene::after { content: "* * *"; color: var(--muted); letter-spacing: .5em; }
footer { font-family: var(--display); color: var(--muted); font-size: .9rem; border-top: 1px solid var(--rule); padding-top: 1.5rem; margin-top: 2rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

h2.section { font-family: var(--body); font-weight: 600; font-size: 1.6rem; margin: 3rem 0 .5rem; text-wrap: balance; }

/* comments */
.chapter p.has-note { background: linear-gradient(var(--mark), var(--mark)) left / 3px 100% no-repeat; padding-left: .6rem; margin-left: -.6rem; cursor: pointer; }
.chapter p.chnote { text-indent: 0; margin-top: 1.5rem; }
.linkbtn { font: inherit; font-family: var(--display); font-size: .9rem; color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
.pills { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: .5rem; padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.pill { pointer-events: auto; font-family: var(--display); font-size: .85rem; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--rule); border-radius: 999px; padding: .45rem .9rem; text-decoration: none; cursor: pointer; }
.pill.go { background: var(--accent); color: var(--paper); border-color: var(--accent); font-weight: 700; font-size: .95rem; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
dialog { font-family: var(--display); color: var(--fg); background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 1.1rem; width: min(34rem, calc(100vw - 24px)); max-height: 88vh; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { font-size: 1.1rem; margin: 0 0 .7rem; }
dialog .quote { font-family: var(--body); font-size: .95rem; border-left: 3px solid var(--mark); padding-left: .7rem; margin: 0 0 .8rem; color: var(--muted); max-height: 9rem; overflow: auto; }
dialog .where { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 .4rem; }
dialog textarea { min-height: 7rem; resize: vertical; }
.field { display: grid; gap: .25rem; margin-bottom: .7rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; align-items: center; }
.row .spacer { flex: 1; }
.clist { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
.clist li { border-top: 1px solid var(--rule); padding-top: .7rem; }
.clist .note { margin: 0 0 .3rem; white-space: pre-wrap; }
.clist .acts { display: flex; gap: .9rem; font-size: .85rem; }
.small { font-size: .85rem; color: var(--muted); margin: .5rem 0 0; }

@media print { body > * { display: none !important; } body::before { content: "This edition is for reading on screen."; font-family: sans-serif; } }
</style>
</head>
<body>
<div class="wrap" id="top">

<section class="lock" id="lock">
  <p class="eyebrow">A middle-grade mystery</p>
  <h1>The Secret of Camp Potuk</h1>
  <p class="byline">Daniel Nichols</p>
  <p class="status"><b>Beta reader’s edition 1, 24 November 2026.</b><br>This edition is for invited readers. Enter the password you were given.</p>
  <form id="lockform" autocomplete="off">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="check"><input type="checkbox" id="remember" checked> Remember me on this device</label>
    <div><button class="btn" id="unlock" type="submit">Open the book</button></div>
    <p class="msg" id="lockmsg" role="status"></p>
  </form>
  <noscript><p class="msg err">This page needs JavaScript to open the book.</p></noscript>
</section>

<main id="book" hidden></main>
</div>

<div class="pills" id="pills" hidden>
  <button type="button" class="pill" id="openlist">Comments</button>
  <button type="button" class="pill go" id="addc" hidden>Comment</button>
  <a class="pill" href="#top">Top</a>
</div>

<dialog id="cdlg">
  <form method="dialog" id="cform">
    <h2>Your comment</h2>
    <p class="where" id="cwhere"></p>
    <blockquote class="quote" id="cquote"></blockquote>
    <div class="field" id="namefield"><label for="cname">Your name</label><input type="text" id="cname" autocomplete="name"></div>
    <div class="field"><label for="ctext">Comment</label><textarea id="ctext"></textarea></div>
    <div class="row">
      <button class="btn" type="submit" value="save" id="csave">Save</button>
      <button class="btn quiet" type="button" id="ccancel">Cancel</button>
      <span class="spacer"></span>
      <button class="linkbtn" type="button" id="cdelete" hidden>Delete</button>
    </div>
  </form>
</dialog>

<dialog id="ldlg">
  <h2>Your comments <span id="lcount"></span></h2>
  <p class="small" id="lhelp"></p>
  <div class="row" id="lsend">
    <button class="btn" type="button" id="lemail">Email them to the author</button>
    <button class="btn quiet" type="button" id="lcopy">Copy all</button>
    <span class="spacer"></span>
    <button class="btn quiet" type="button" id="lclose">Close</button>
  </div>
  <p class="msg" id="lmsg" role="status"></p>
  <ul class="clist" id="clist"></ul>
</dialog>

    $('book').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-chnote]');
      if (b) { var art = b.closest('.chapter'); openEditor({ ch: +art.dataset.ch, title: art.dataset.title, p: 0, quote: '' }); return; }
      var p = ev.target.closest('p.has-note');
      if (p && String(window.getSelection()) === '') { var c = comments.filter(function (c) { return c.ch + '.' + c.p === p.dataset.p; })[0]; if (c) openEditor(c); }
    });
  }

  // ---------- comments ----------
  var pending = null, editing = null;
  function onSelection() {
    var sel = window.getSelection(), txt = sel ? String(sel).replace(/\s+/g, ' ').trim() : '';
    pending = null;
    if (txt && sel.rangeCount && !$('cdlg').open && !$('ldlg').open) {
      var node = sel.getRangeAt(0).startContainer; node = node.nodeType === 1 ? node : node.parentElement;
      var p = node && node.closest('.chapter p[data-p]'), art = node && node.closest('.chapter[data-ch]');
      if (p && art) pending = { ch: +art.dataset.ch, title: art.dataset.title, p: +p.dataset.p.split('.')[1], quote: txt.slice(0, 1200) };
    }
    $('addc').hidden = !pending;
  }
  function where(c) { return 'Chapter ' + c.ch + ', ' + c.title + (c.p ? ', paragraph ' + c.p : ''); }
  function openEditor(c) {
    editing = c;
    $('cwhere').textContent = where(c);
    $('cquote').textContent = c.quote || ''; $('cquote').hidden = !c.quote;
    $('ctext').value = c.note || '';
    $('cname').value = LS.get(K_NAME) || slotLabel || '';
    $('namefield').hidden = !!(LS.get(K_NAME));
    $('cdelete').hidden = !c.id;
    $('addc').hidden = true;
    $('cdlg').showModal(); $('ctext').focus();
  }
  $('ccancel').addEventListener('click', function () { $('cdlg').close(); });
  $('cdelete').addEventListener('click', function () {
    if (editing && editing.id) { comments = comments.filter(function (c) { return c.id !== editing.id; }); editing.note = '[comment withdrawn by the reader]'; editing.sent = false; post(editing, true); persist(); }
    $('cdlg').close();
  });
  $('cform').addEventListener('submit', function () {
    var note = $('ctext').value.trim(); if (!note || !editing) return;
    var name = $('cname').value.trim(); if (name) LS.set(K_NAME, name);
    var c = editing;
    if (!c.id) { c.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); comments.push(c); }
    c.note = note; c.at = new Date().toISOString(); c.edition = CFG.edition; c.sent = false;
    persist(); post(c);
    try { window.getSelection().removeAllRanges(); } catch (e) {}
  });
  function persist() { LS.set(K_COM, JSON.stringify(comments)); markAll(); updateCount(); }
  function markAll() {
    document.querySelectorAll('p.has-note').forEach(function (p) { p.classList.remove('has-note'); p.removeAttribute('title'); });
    comments.forEach(function (c) { if (!c.p) return; var p = document.querySelector('p[data-p="' + c.ch + '.' + c.p + '"]'); if (p) { p.classList.add('has-note'); p.title = 'You commented here'; } });
  }
  function updateCount() { $('openlist').textContent = comments.length ? 'Comments (' + comments.length + ')' : 'Comments'; }

  // delivery: straight to the author's collection sheet when one is set up; otherwise the reader emails them
  function post(c, gone) {
    var f = CFG.form; if (!f || !f.url) return;
    var d = new URLSearchParams(), m = f.fields || {};
    var vals = { id: c.id, reader: LS.get(K_NAME) || slotLabel || '', edition: CFG.editionLine, chapter: 'Chapter ' + c.ch + ', ' + c.title, paragraph: c.p ? String(c.p) : '', quote: c.quote || '', note: c.note, at: c.at || new Date().toISOString() };
    Object.keys(vals).forEach(function (k) { if (m[k]) d.append(m[k], vals[k]); });
    fetch(f.url, { method: 'POST', mode: 'no-cors', body: d }).then(function () { if (!gone) { c.sent = true; LS.set(K_COM, JSON.stringify(comments)); } }).catch(function () {});
  }
  function retryUnsent() { if (CFG.form && CFG.form.url) comments.forEach(function (c) { if (!c.sent) post(c); }); }
  window.addEventListener('online', retryUnsent);

  function allText() {
    var name = LS.get(K_NAME) || slotLabel || '';
    var out = ['Comments on ' + CFG.title + ', ' + CFG.editionLine + (name ? ', from ' + name : ''), ''];
    comments.slice().sort(function (a, b) { return a.ch - b.ch || a.p - b.p; }).forEach(function (c) {
      out.push(where(c)); if (c.quote) out.push('"' + c.quote + '"'); out.push(c.note); out.push('');
    });
    return out.join('\n');
  }
  $('openlist').addEventListener('click', function () {
    var auto = !!(CFG.form && CFG.form.url);
    $('lcount').textContent = comments.length ? '(' + comments.length + ')' : '';
    $('lhelp').textContent = !comments.length ? 'You have no comments yet. Select a passage in the book and choose Comment, or use the link at the end of a chapter.'
      : auto ? 'Your comments reach the author as you save them. They are also kept on this device so you can change them.'
      : 'Your comments are kept on this device as you read. When you are ready, send them to the author.';
    $('lemail').hidden = !CFG.email || !comments.length; $('lcopy').hidden = !comments.length; $('lmsg').textContent = '';
    var ul = $('clist'); ul.innerHTML = '';
    comments.slice().sort(function (a, b) { return a.ch - b.ch || a.p - b.p; }).forEach(function (c) {
      var li = document.createElement('li');
      var w = document.createElement('p'); w.className = 'where'; w.textContent = where(c); li.appendChild(w);
      if (c.quote) { var q = document.createElement('blockquote'); q.className = 'quote'; q.textContent = c.quote; li.appendChild(q); }
      var n = document.createElement('p'); n.className = 'note'; n.textContent = c.note; li.appendChild(n);
      var acts = document.createElement('div'); acts.className = 'acts';
      var e = document.createElement('button'); e.type = 'button'; e.className = 'linkbtn'; e.textContent = 'Change'; e.onclick = function () { $('ldlg').close(); openEditor(c); };
      var g = document.createElement('button'); g.type = 'button'; g.className = 'linkbtn'; g.textContent = 'Go to it'; g.onclick = function () { $('ldlg').close(); var t = (c.p && document.querySelector('p[data-p="' + c.ch + '.' + c.p + '"]')) || $('ch' + c.ch); if (t) t.scrollIntoView({ block: 'center' }); };
      acts.appendChild(e); acts.appendChild(g); li.appendChild(acts); ul.appendChild(li);
    });
    $('ldlg').showModal();
  });
  $('lclose').addEventListener('click', function () { $('ldlg').close(); });
  async function copyAll() { try { await navigator.clipboard.writeText(allText()); return true; } catch (e) { return false; } }
  $('lcopy').addEventListener('click', async function () { $('lmsg').textContent = (await copyAll()) ? 'Copied. Paste them into an email or a message to the author.' : 'Copying is not allowed in this browser.'; });
  $('lemail').addEventListener('click', async function () {
    var body = allText(), subject = 'Comments on ' + CFG.title + ', ' + CFG.editionLine;
    var copied = await copyAll();
    if (body.length > 1500) body = copied ? 'My comments are copied. (Paste them here.)' : body.slice(0, 1500) + '\n[more comments follow; use Copy all]';
    $('lmsg').textContent = copied ? 'Your email is opening. The comments are also copied, in case you need to paste them. If no email opens, send them to ' + CFG.email + '.' : 'Your email is opening. If nothing opens, send them to ' + CFG.email + '.';
    location.href = 'mailto:' + CFG.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  });
})();
</script>
</body>
</html>
